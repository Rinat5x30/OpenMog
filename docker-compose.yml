name: hr_system

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_system}
      POSTGRES_USER: ${POSTGRES_USER:-hr_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Postgres и Ollama — внутри compose-сети/на хосте, а не на localhost контейнера.
      # Ollama ОБЯЗАТЕЛЬНО остаётся системным сервисом на хосте (доступ к GPU), не в контейнере.
      POSTGRES_HOST: db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  qcluster:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "manage.py", "qcluster"]

volumes:
  pgdata:
  media:
